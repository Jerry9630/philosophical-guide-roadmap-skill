<path d="M642 912 C642 946, 642 946, 642 410" fill="none" stroke="#d59a31" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-pending)"/>
<text x="642" y="938" text-anchor="middle" class="edge">两处都在追问理解与生活经验的关系</text>
<g class="card" data-roadmap-id="collapse-a-early">
<rect x="70" y="230" width="320" height="165" rx="22" fill="#eef1f4" stroke="#9aaab5" stroke-width="2.5" stroke-dasharray="5 5"/>
<rect x="88" y="247" width="188" height="27" rx="13" fill="#dfe5e9"/>
<text x="102" y="266" class="badge" fill="#586a76">折叠展示 · 3 个节点</text>
<text x="90" y="305" class="node-title"><tspan x="90" dy="0">早期路径</tspan></text>
<text x="90" y="338" class="body"><tspan x="90" dy="0">从未经反思也能生活得好，推进到反思</tspan><tspan x="90" dy="22">可以澄清选择依据。</tspan></text>
</g>
<g class="card" data-roadmap-id="a-u3">
<rect x="482" y="230" width="320" height="180" rx="22" fill="#ffffff" stroke="#83ad9c" stroke-width="2.5"/>
<rect x="500" y="247" width="92" height="27" rx="13" fill="#dfeee7"/>
<text x="514" y="266" class="badge" fill="#32634f">用户确认</text>
<text x="502" y="305" class="node-title"><tspan x="502" dy="0">当前观点</tspan></text>
<text x="502" y="338" class="body"><tspan x="502" dy="0">反思不是无条件的好事，可能意味着主</tspan><tspan x="502" dy="22">动承担代价。</tspan></text>
<text x="502" y="391" class="quote"><tspan x="502" dy="0">原话：“愿不愿意承担这个代价”</tspan></text>
</g>
<g class="card" data-roadmap-id="a-u4">
<rect x="482" y="446" width="320" height="165" rx="22" fill="#f2f6fc" stroke="#86a1ca" stroke-width="2.5" stroke-dasharray="8 6"/>
<rect x="500" y="463" width="172" height="27" rx="13" fill="#dfe9f8"/>
<text x="514" y="482" class="badge" fill="#456a9f">模型触发 · 未展开</text>
<text x="502" y="521" class="node-title"><tspan x="502" dy="0">反思与自由的关系</tspan></text>
<text x="502" y="554" class="body"><tspan x="502" dy="0">未经检验的选择，仍是自由的吗？</tspan></text>
</g>
<g class="card" data-roadmap-id="a-u5">
<rect x="894" y="230" width="320" height="165" rx="22" fill="#ffffff" stroke="#83ad9c" stroke-width="3" stroke-dasharray="3 4"/>
<rect x="912" y="247" width="188" height="27" rx="13" fill="#dfeee7"/>
<text x="926" y="266" class="badge" fill="#32634f">用户确认 · 重新激活</text>
<text x="914" y="305" class="node-title"><tspan x="914" dy="0">旧问题重新进入讨论</tspan></text>
<text x="914" y="338" class="body"><tspan x="914" dy="0">这真的是他自己的生活吗？</tspan></text>
<text x="914" y="369" class="quote"><tspan x="914" dy="0">原话：“这真的是他自己的生活吗”</tspan></text>
</g>
<g class="card" data-roadmap-id="a-m2">
<rect x="1306" y="230" width="320" height="165" rx="22" fill="#fff8e9" stroke="#d7a343" stroke-width="4"/>
<rect x="1324" y="247" width="244" height="27" rx="13" fill="#f7e7bd"/>
<text x="1338" y="266" class="badge" fill="#94681e">模型推测 · 待确认 · 当前位置</text>
<text x="1326" y="305" class="node-title"><tspan x="1326" dy="0">可能的判断标准变化</tspan></text>
<text x="1326" y="338" class="body"><tspan x="1326" dy="0">判断标准可能从是否生活得更好转向选</tspan><tspan x="1326" dy="22">择是否真正属于自己。</tspan></text>
</g>
<g class="card" data-roadmap-id="b-u1">
<rect x="70" y="747" width="320" height="165" rx="22" fill="#ffffff" stroke="#83ad9c" stroke-width="4"/>
<rect x="88" y="764" width="188" height="27" rx="13" fill="#dfeee7"/>
<text x="102" y="783" class="badge" fill="#32634f">用户确认 · 当前位置</text>
<text x="90" y="822" class="node-title"><tspan x="90" dy="0">独立提出的新问题</tspan></text>
<text x="90" y="855" class="body"><tspan x="90" dy="0">没有生活经验的 AI，能理解人吗？</tspan></text>
<text x="90" y="886" class="quote"><tspan x="90" dy="0">原话：“没有生活经验的 AI，能理解人</tspan><tspan x="90" dy="18">吗”</tspan></text>
</g>
<g class="card" data-roadmap-id="b-m1">
