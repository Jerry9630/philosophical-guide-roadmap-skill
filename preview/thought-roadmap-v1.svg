<text x="90" y="713" class="tree">主题树 2</text>
<text x="236" y="713" class="tree">AI 能否真正理解人？</text>
<path d="M390 312 C436 312, 436 320, 482 320" fill="none" stroke="#687a74" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="436" y="303" text-anchor="middle" class="edge">限定</text>
<path d="M390 312 C436 312, 436 528, 482 528" fill="none" stroke="#687a74" stroke-width="2.7" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
