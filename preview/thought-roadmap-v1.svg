<text x="70" y="98" class="subtitle"><tspan x="70" dy="0">反思是否必要，以及反思与自由的关系</tspan></text>
<rect x="1046" y="36" width="580" height="78" rx="18" fill="#ffffff" stroke="#dce5df"/>
<circle cx="1072" cy="62" r="7" fill="#83ad9c"/>
<text x="1087" y="67" class="legend">用户确认</text>
<circle cx="1204" cy="62" r="7" fill="#86a1ca"/>
<text x="1219" y="67" class="legend">模型触发</text>
<circle cx="1336" cy="62" r="7" fill="#d7a343"/>
<text x="1351" y="67" class="legend">待确认</text>
<text x="1072" y="96" class="legend">路径状态：粗框＝当前　虚线＝未展开／搁置　点划线＝重新激活</text>
